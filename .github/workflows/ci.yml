name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build
        run: swift build --build-tests

      # Runners are headless, so these cover pure logic only. Anything that
      # creates a real display belongs in understudy-probe, run manually.
      - name: Test
        run: swift test --skip-build

      # Understudy calls undocumented CoreGraphics API. If Apple removes these
      # classes in a future macOS, this fails loudly instead of silently
      # shipping a broken build.
      - name: Verify private API still exists
        run: |
          clang -fobjc-arc -framework Foundation Tools/dump-private-api.m -o /tmp/dump
          /tmp/dump | tee /tmp/dump.txt
          if grep -q "NOT FOUND" /tmp/dump.txt; then
            echo "::error::A private CoreGraphics virtual-display class is missing on $(sw_vers -productVersion)."
            exit 1
          fi
          echo "All four private classes present on macOS $(sw_vers -productVersion)."

  lint:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken relative links in Markdown
        run: |
          status=0
          while IFS= read -r file; do
            grep -oE '\]\([^)#][^)]*\)' "$file" 2>/dev/null \
              | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
              | grep -vE '^(https?:|mailto:)' \
              | while IFS= read -r link; do
                  [ -z "$link" ] && continue
                  target="$(dirname "$file")/$link"
                  if [ ! -e "$target" ]; then
                    echo "::error file=$file::Broken link: $link"
                    exit 1
                  fi
                done || status=1
          done < <(find . -name '*.md' -not -path './.build/*')
          exit $status
